<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f6fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sopralluoghi">
<title>Sopralluoghi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#18212b; --muted:#647283; --line:#dde3ea;
  --accent:#0f6fb8; --accent-ink:#fff; --accent-soft:#e3f0fa;
  --danger:#c62f2f; --ok:#1d8a4e; --warn:#b7791f;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141a; --card:#18202a; --ink:#e7edf3; --muted:#93a2b3; --line:#2a3542;
    --accent:#4aa3e8; --accent-ink:#071522; --accent-soft:#16324a; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
header.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{color:var(--danger);border-color:var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.search{width:100%;margin:14px 0 6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.stats{display:flex;gap:14px;margin-top:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 4px}
.sec h2{font-size:15px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--line);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fab{position:fixed;right:max(16px,calc(50% - 414px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;height:56px;padding:0 22px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:96vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){ .modal{align-items:center} .sheet{border-radius:18px;max-height:90vh} }
.sheet .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet .hd h3{margin:0;font-size:17px;flex:1}
.sheet .bd{overflow:auto;padding:14px 16px 24px}
.sheet .ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet .ft .btn{flex:1}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.in-f{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:44px}
textarea.in-f{min-height:80px;resize:vertical}
.in-f:focus{outline:2px solid var(--accent);outline-offset:-1px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.unit{position:relative} .unit input{padding-right:40px} .unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.extra{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-top:6px}
.calc{margin-top:8px;font-size:14px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer;line-height:1}
.ph.add{border:2px dashed var(--line);background:transparent;cursor:pointer;flex-direction:column;gap:4px;font-weight:600}
.ph.add svg{width:26px;height:26px}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#1d2733;color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font-size:14px}
.toast a,.toast button{color:#8cc8ff;background:none;border:0;font-weight:700;cursor:pointer;padding:0}
.busy{position:fixed;inset:0;z-index:80;background:rgba(10,15,20,.5);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--card);padding:18px 22px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:86vw}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:absolute;right:16px;top:56px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:230px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;border:0;background:none;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.hidden{display:none!important}
.tabs{display:flex;gap:4px;margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.ph .st{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff}
.ph .st.ok{background:var(--ok)} .ph .st.err{background:var(--danger)}
.ph.dim img{opacity:.55}
.dest{font-size:13px;color:var(--muted);margin-top:10px;word-break:break-word}
.dest b{color:var(--ink)}

.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;flex:none;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.pend .dot{background:var(--warn)} .sync.off .dot{background:var(--muted)} .sync.err .dot{background:var(--danger)}
.sync.run .dot{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
.pair{max-width:460px;margin:0 auto;padding:40px 16px}
.pair h1{font-size:24px;margin:0 0 6px}
.codein{font:700 26px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);margin-left:6px;vertical-align:2px}
.ph .st{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff}
.ph .st.ok{background:var(--ok)} .ph .st.err{background:var(--danger)}
.ph.dim img{opacity:.6}
.tabs{display:flex;gap:4px;margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.dest{font-size:13px;color:var(--muted);margin-top:10px;word-break:break-word}
.dest b{color:var(--ink)}
.list-k{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="in" id="hdr"></div></header>
<main class="wrap" id="app"><div class="empty"><div class="spin" style="margin:0 auto"></div></div></main>
<div id="layer"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileGal" accept="image/*" multiple class="hidden">
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
